# Configuration du connecteur GNU Health → ROHAFYA.
# À copier en /etc/rohafya/connecteur.ini, lisible seulement par le compte système qui fait
# tourner GNU Health (chmod 600) : il contient la clé d'API de l'établissement.
# Ce compte n'est pas forcément « gnuhealth » : voir le README, étape 2.

[rohafya]
# Adresse publique de l'API ROHAFYA (https obligatoire).
url = https://api.rohafya.com
# Clé d'API de l'établissement (super-administration ROHAFYA → établissement → Intégration).
# Peut aussi être fournie par la variable d'environnement ROHAFYA_CLE_API.
cle_api =
# Certificat de l'autorité qui a signé le certificat de l'API, si ce n'est pas une autorité publique.
ca_file =
timeout = 60
# Nombre d'éléments par envoi (500 au maximum).
taille_lot = 100

[gnuhealth]
# Fichier de configuration du serveur trytond (chemin donné après -c dans la commande du serveur).
# Exemple : /home/<compte>/gnuhealth/tryton/server/config/trytond.conf
trytond_conf = /home/gnuhealth/gnuhealth/tryton/server/config/trytond.conf
base = pdmd_sante
# Identifiant (id) de l'utilisateur *Tryton* utilisé pour la lecture, à ne pas confondre avec le
# compte système : 0 = root, comme l'API actuelle. La transaction est toujours en lecture seule.
utilisateur_tryton = 0
# true : seuls les patients dont la case « résultats en ligne » (result_online) est cochée sont envoyés.
# Mettre false pour une base GNU Health sans ce champ (module spécifique PDMD Santé).
filtre_result_online = true

[connecteur]
fichier_etat = /var/lib/rohafya-connecteur/etat.json
# Marge de recouvrement entre deux synchronisations (les envois sont idempotents).
chevauchement_minutes = 10
# Fichier journal (en plus de la sortie standard). Vide : sortie standard seulement.
journal = /var/log/rohafya-connecteur.log
