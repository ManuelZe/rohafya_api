  /users/send_email:
    post:
      summary: Send_Email
      responses: {}
      tags:
        - Login And Logout
      description: >-
        Requête d'envoi de l'email, Utilisé pour envoyer les identifiants de
        connexion à un utilisateur


        ``` python

        def send_mail():
            app = create_app()
            DoctorFederationID = None
            PatientFederationID = None
            email = None
            if request.method == "POST":
                try :
                    PatientFederationID = request.get_json()["federation_id"]
                    DoctorFederationID = request.get_json()["federation_id"]
                except KeyError:
                    return {"Message" : "Aucun Email ou Matricule fourni dans la requête."}

                passwordmanager = PasswordManager(app)
                hash_password = passwordmanager.hash_password
                
                username = generate_random_letters()
                password = generate_random_letters_and_digits()
                
                user_d = None
                if DoctorFederationID :
                    user_d = db.session.execute(select(Doctors).filter_by(DoctorFederationID=DoctorFederationID)).scalar_one_or_none()

                if PatientFederationID and user_d is None :
                    user_d = db.session.execute(select(Patients).filter_by(PatientFederationID=PatientFederationID)).scalar_one_or_none()
                
                user_id = user_d.user_id if user_d else None
                
                if user_d:
                    user = db.session.execute(select(User).filter_by(id=user_id)).scalar_one_or_none()
                    if user :
                        user.username = username
                        user.password = hash_password(password)

                        try:
                            matricule = user_d.DoctorFederationID
                        except AttributeError:
                            matricule = user_d.PatientFederationID

                        body = "Paramètres de Connexion."

                        context = {
                            "first_name" : user.first_name + " " + user.last_name,
                            "matricule"  : matricule,
                            "email" : user.email,
                            "Date" : datetime.now(),
                            "username" : username,
                            "password" : password
                        }

                        subject = "PARAMETRES DE CONNEXION A L'APPLICATION"
                        template_html = "emails/connexion_email.html"
                        try :
                            send_email(user.email, subject, body, template_html, **context)

                            db.session.commit()

                            return {"User_mail" : user.email,
                                    "Message" : "Identifiants Envoyés avec succès",
                                    "Username" : username
                                }
                        except :

                            return {"Message " : " Email Inexistant"}

                    return {"Message" : "Veuillez vérifier le matricule entré."}
                
                else :
                    return {"Message " : " Aucun Docteur Trouvé avec cet Email / Matricule"}

         ```
