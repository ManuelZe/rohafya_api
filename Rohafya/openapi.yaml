                    return {"message" : error}

                db.session.commit()

                doctor = Doctors.query.filter_by(id=doctor_id).first()

                user_id = doctor.user
                user = User.query.filter_by(id=user_id.id).first()
                user.email = doctor.DoctorEmail
                user.first_name= doctor.DoctorName
                user.last_name = doctor.DoctorLastname

                db.session.commit()

            return {"Doctor" : doctor.to_dict()}

