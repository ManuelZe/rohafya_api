            Returns:
                json: Json descriptif du dernier docteur ajouté.
            """

            doctors = tryton.pool.get('gnuhealth.healthprofessional')
            GNUDoctors = doctors.search([('code', '!=', None)], limit=50)

            for doctor in GNUDoctors :
                if doctor.active :
