        content:
          application/json:
            schema:
              type: object
              properties:
                doctor_id:
                  type: integer
                exam_type:
                  type: string
                exam_code:
                  type: string
            example:
              doctor_id: 1
              exam_type: Laboratoire
              exam_code: TEST2486
