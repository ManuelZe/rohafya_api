{# Mise en page commune des e-mails (français et anglais). Blocs : title, content. #}
<!DOCTYPE html>
<html lang="{{ locale or 'fr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ROHAFYA{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background:#f4f6fa; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6fa; padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px; background:#ffffff; border-radius:12px; padding:32px 28px;">
                    <tr><td style="font-size:22px; font-weight:700; color:#047857; padding-bottom:16px;">{% block brand %}ROHAFYA{% endblock %}</td></tr>
                    {% block content %}{% endblock %}
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
