<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Votre code de connexion ROHAFYA</title>
</head>
<body style="margin:0; padding:0; background:#f4f6fa; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6fa; padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px; background:#ffffff; border-radius:12px; padding:32px 28px;">
                    <tr>
                        <td style="font-size:22px; font-weight:700; color:#1a54c9; padding-bottom:16px;">ROHAFYA</td>
                    </tr>
                    <tr>
                        <td style="font-size:16px; line-height:1.5; padding-bottom:20px;">
                            Voici votre code de connexion à ROHAFYA&nbsp;:
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-bottom:20px;">
                            <div style="display:inline-block; font-size:32px; letter-spacing:8px; font-weight:700; color:#15359e; background:#eaf0fc; border-radius:10px; padding:14px 24px;">{{ code }}</div>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:14px; line-height:1.5; color:#545d6b;">
                            Ce code est valable {{ minutes }} minutes et ne peut servir qu'une fois.
                            Si vous n'avez pas demandé à vous connecter, ignorez simplement ce message&nbsp;: votre compte reste protégé.
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:12px; color:#8a93a3; padding-top:24px;">
                            Message envoyé à {{ email }} par ROHAFYA— {{ front_url }}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
