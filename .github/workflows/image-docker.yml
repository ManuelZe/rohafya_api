# Construit l'image Docker de l'API ROHAFYA et la publie sur GitHub Container Registry.
#   - push sur main        → ghcr.io/manuelze/rohafya-api:latest  + :sha-xxxxxxx
#   - tag v1.2.3           → ghcr.io/manuelze/rohafya-api:1.2.3   + :1.2
#   - pull request         → tests et construction seulement (rien n'est publié)
# Documentation : docs/DEPLOIEMENT_DOCKER.md

name: Image Docker de l'API

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/manuelze/rohafya-api

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docker/requirements.txt

      - name: Dépendances
        run: pip install -r docker/requirements.txt

      - name: Tests de l'API (module SaaS)
        run: python Rohafya/tests/test_saas.py

      - name: Tests de l'API (demandes aux établissements)
        run: python Rohafya/tests/test_demandes.py

      - name: Tests du connecteur GNU Health
        run: python connecteur_gnuhealth/tests/test_connecteur.py

  image:
    name: Image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # VPS ARM (Ampere, Graviton…) : ajouter linux/arm64.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
